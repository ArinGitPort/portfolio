<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Allen | Full-Stack Developer</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="index.css" />
    <!-- Link to external CSS file -->
  </head>
  <body>
    <!-- Navigation -->
    <nav>
      <div class="logo-wrapper">
        <div class="logo" style="color: #bd93f9; text-shadow: 0 0 10px #bd93f9, 0 0 20px #8a71b3">
          <div class="logo-container">
            <img class="main-logo" src="assets/dog.png" alt="" />
          </div>
          <h1>Allen</h1>
        </div>
      </div>
      <div class="nav-links">
        <a href="#home">Home</a>
        <a href="#skills">Skills</a>
        <a href="#projects">Projects</a>
        <a href="#contact">Contact</a>
      </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero" id="home">
      <div class="hero-content">
        <h1>Full-Stack Developer</h1>
        <h2>
          Hi, I'm Allen, a passionate developer based in the Philippines. <br />
          I specialize in building modern web and mobile applications.
        </h2>
        <a href="#contact" class="cta-button">Get In Touch</a>
      </div>
    </section>

    <!-- Skills Section -->
    <section class="skills" id="skills">
      <h2 class="section-title">My Tech Stack</h2>
      <div class="skills-grid">
        <div class="skill-card floating">
          <div class="skill-icon"><i class="fab fa-js"></i></div>
          <h3>JavaScript</h3>
        </div>
        <div class="skill-card floating" style="animation-delay: 0.2s">
          <div class="skill-icon"><i class="fab fa-java"></i></div>
          <h3>Java</h3>
        </div>
        <div class="skill-card floating" style="animation-delay: 0.4s">
          <div class="skill-icon"><i class="fab fa-android"></i></div>
          <h3>Kotlin</h3>
        </div>
        <div class="skill-card floating" style="animation-delay: 0.6s">
          <div class="skill-icon"><i class="fab fa-php"></i></div>
          <h3>PHP</h3>
        </div>
        <div class="skill-card floating" style="animation-delay: 0.8s">
          <div class="skill-icon"><i class="fab fa-python"></i></div>
          <h3>Python</h3>
        </div>
        <div class="skill-card floating" style="animation-delay: 1s">
          <div class="skill-icon"><i class="fas fa-database"></i></div>
          <h3>MySQL</h3>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer id="contact">
      <div class="social-links">
        <a href="https://github.com/ArinGitPort"
          ><i class="fab fa-github"></i
        ></a>
        <a href="https://www.linkedin.com/in/allen-lazatin-834710279/"
          ><i class="fab fa-linkedin"></i
        ></a>
        <a href="https://x.com/home?lang=en"><i class="fab fa-twitter"></i></a>
        <a href="#"><i class="fas fa-envelope"></i></a>
      </div>
      <p class="copyright">© 2023 Allen. All rights reserved.</p>
    </footer>
  </body>
</html>
